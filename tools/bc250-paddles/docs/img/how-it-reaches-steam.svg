<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">How L4/R4 reach Steam Input</title>
<desc id="desc">L4 and R4 travel from the pad through the receiver in DInput mode, the kernel and SDL inside Steam to Steam Input; Steam ignores config.vdf for this pad and only the SDL_GAMECONTROLLERCONFIG variable set by bc250-paddles adds the paddles.</desc>
